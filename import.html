<!DOCTYPE html>
<html>
<head>
  <title>Import Tab Group</title>
  <style>
    body {
      font-family: system-ui;
      background: #0f0f0f;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    h2 {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    button {
      font-weight: bold;
      padding: 10px 20px;
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
    #groupTitle {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
    }
    .tab-item {
      padding: 10px;
      margin-bottom: 8px;
      background: #2a2a2a;
      border-radius: 5px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s;
    }
    .tab-item:hover {
      background: #333;
    }
    .tab-item a {
      flex: 1;
      color: #60a5fa;
      text-decoration: none;
      word-break: break-word;
      font-size: 14px;
    }
    .tab-item a:hover {
      text-decoration: underline;
    }
    .tab-icon {
      font-size: 12px;
      color: #888;
      min-width: 20px;
    }
  </style>
</head>
<body>
  <h2>
    <img src="icons/tabshare16.png" alt="">
    Import Tab Group
  </h2>
  <button id="open" style="margin-top: 20px;">Import All Tabs</button>
  
  <div id="preview" style="display: none; width: 100%; max-width: 600px;">
    <h3 id="groupTitle" style="margin: 20px 0 10px 0;"></h3>
    <div id="tabsList" style="background: #1a1a1a; border-radius: 8px; padding: 15px; max-height: 400px; overflow-y: auto; margin-bottom: 20px;"></div>
  </div>
  

  <script src="import.js"></script>
</body>
</html>
